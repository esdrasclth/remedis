services:
  postgres:
    image: postgres:16-alpine
    container_name: remedis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: remedis
      POSTGRES_PASSWORD: remedis_dev
      POSTGRES_DB: remedis
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remedis -d remedis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
