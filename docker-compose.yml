services:
  postgres:
    image: postgres:16-alpine
    container_name: remedis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: remedis
      POSTGRES_PASSWORD: remedis_dev
      POSTGRES_DB: remedis
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remedis -d remedis"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: remedis_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: remedis_minio
      MINIO_ROOT_PASSWORD: remedis_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
