services:
    postgres:
      image: postgres:16-alpine
      container_name: remedis_db
      restart: unless-stopped
      environment:
        POSTGRES_USER: remedis
        POSTGRES_PASSWORD: remedis_dev
        POSTGRES_DB: remedis
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U remedis -d remedis"]
        interval: 10s
        timeout: 5s
        retries: 5

    app:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: remedis_app
      restart: unless-stopped
      ports:
        - "3002:3000"
      environment:
        NODE_ENV: production
        DATABASE_URL: "postgresql://remedis:remedis_dev@postgres:5432/remedis"
        AUTH_SECRET: ${AUTH_SECRET}
        AUTH_URL: ${AUTH_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
        MINIO_ENDPOINT: ${MINIO_ENDPOINT}
        MINIO_PORT: ${MINIO_PORT}
        MINIO_USE_SSL: ${MINIO_USE_SSL}
        MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
        MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
        MINIO_BUCKET: ${MINIO_BUCKET}
        RESEND_API_KEY: ${RESEND_API_KEY}
        EMAIL_FROM: ${EMAIL_FROM}
        STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
        STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - default
        - dokploy-network

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true